name: Build mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --stacktrace

      - name: Dump Minecraft API (on failure, for debugging)
        if: failure()
        run: |
          J=/home/runner/.gradle/caches/fabric-loom/26.2/minecraft-merged.jar
          echo "Using $J"
          javap -cp "$J" -public net.minecraft.client.Minecraft | grep -iE "screen|gui|gameMode|player\b|setOverlay"
          echo "=== MultiPlayerGameMode"; javap -cp "$J" -public net.minecraft.client.multiplayer.MultiPlayerGameMode | grep -iE "container|click|input|inventory"
          echo "=== KeyMapping"; javap -cp "$J" -public net.minecraft.client.KeyMapping | grep -iE "static|consume"
          echo "=== Gui"; for g in net.minecraft.client.gui.Gui; do javap -cp "$J" -public $g | grep -iE "overlay|message|actionbar"; done
          echo "=== LocalPlayer"; javap -cp "$J" -public net.minecraft.client.player.LocalPlayer | grep -iE "message|overlay|sendSystem"
          echo "=== Player"; javap -cp "$J" -public net.minecraft.world.entity.player.Player | grep -iE "displayClient|message|overlay"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: auto-helmet-swap
          path: build/libs/auto-helmet-swap-*[0-9].jar

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/auto-helmet-swap-*[0-9].jar | head -1)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$JAR" --title "Auto Helmet Swap (MC 26.2)" --notes "Ready-to-install Fabric mod for Minecraft 26.2. Needs Fabric Loader and Fabric API."
