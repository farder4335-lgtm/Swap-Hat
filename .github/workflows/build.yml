name: Build mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --stacktrace

      - name: Dump Minecraft API (on failure, for debugging)
        if: failure()
        run: |
          find ~/.gradle ~/work -name "minecraft*.jar" 2>/dev/null | head -20
          J=$(find ~/.gradle -name "minecraft*merged*.jar" -o -name "minecraft-*.jar" 2>/dev/null | grep -v sources | head -1)
          echo "Using $J"
          for c in net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.client.KeyMapping net.minecraft.world.entity.player.Inventory net.minecraft.world.inventory.ClickType net.minecraft.world.inventory.ContainerInput net.minecraft.client.gui.Gui; do
            echo "=== $c"; javap -cp "$J" -public "$c" 2>&1 | head -80
          done

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: auto-helmet-swap
          path: build/libs/auto-helmet-swap-*[0-9].jar

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/auto-helmet-swap-*[0-9].jar | head -1)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$JAR" --title "Auto Helmet Swap (MC 26.2)" --notes "Ready-to-install Fabric mod for Minecraft 26.2. Needs Fabric Loader and Fabric API."
